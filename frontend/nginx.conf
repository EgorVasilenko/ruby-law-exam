server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow uploads up to a bit above the app's 10 MB limit, so the backend
    # (not nginx) returns the precise 413 error.
    client_max_body_size 12m;

    # Forward API calls to the backend container (compose service name "backend").
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: serve index.html so client-side routes (e.g. /contracts/:id)
    # work on refresh / deep-link.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
